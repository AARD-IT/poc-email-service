<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Full Platform Access</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;color:#222;margin:0;padding:0}
      .container{max-width:600px;margin:24px auto;padding:24px;border:1px solid #eaeaea}
      .header{background:#0b5fff;color:#fff;padding:16px;text-align:center}
      .content{padding:16px}
      .footer{font-size:12px;color:#666;margin-top:20px}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header"><h1>Full Access Granted</h1></div>
      <div class="content">
        <p>Hi {{ name }},</p>
        <p>You have been granted full access to the platform across the following areas:</p>
        <ul>
        {% for a in areas %}
          <li>{{ a }}</li>
        {% endfor %}
        </ul>
        <p><a href="{{ website_url }}">Open Analytics Avenue</a></p>
        <p class="footer">Contact support for onboarding assistance.</p>
      </div>
    </div>
  </body>
</html>
