<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POC Access Assigned</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;color:#222;margin:0;padding:0}
      .container{max-width:600px;margin:24px auto;padding:24px;border:1px solid #eaeaea}
      .header{background:#0b5fff;color:#fff;padding:16px;text-align:center}
      .content{padding:16px}
      .chips{margin-top:8px}
      .chip{display:inline-block;background:#f1f5ff;padding:6px 10px;border-radius:16px;margin-right:6px}
      .footer{font-size:12px;color:#666;margin-top:20px}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header"><h1>Access Assigned</h1></div>
      <div class="content">
        <p>Hi {{ name }},</p>
        <p>You have been granted access to the following POCs / modules:</p>
        <div class="chips">
          {% for p in assigned_pocs %}
            <span class="chip">{{ p }}</span>
          {% endfor %}
        </div>
        <p><a href="{{ website_url }}">Open Analytics Avenue</a></p>
        <p class="footer">If you have issues accessing these resources contact support.</p>
      </div>
    </div>
  </body>
</html>
