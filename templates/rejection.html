<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account Rejected</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;color:#222;margin:0;padding:0}
      .container{max-width:600px;margin:24px auto;padding:24px;border:1px solid #eaeaea}
      .header{background:#ff4d4f;color:#fff;padding:16px;text-align:center}
      .content{padding:16px}
      .footer{font-size:12px;color:#666;margin-top:20px}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header"><h1>Account Rejected</h1></div>
      <div class="content">
        <p>Hi {{ name }},</p>
        <p>We're sorry to inform you that your account request was rejected.</p>
        <p>Reason: {{ reason }}</p>
        <p class="footer">If you believe this is a mistake, contact support.</p>
      </div>
    </div>
  </body>
</html>
