<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Signup Alert</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;color:#222;margin:0;padding:0}
      .container{max-width:600px;margin:24px auto;padding:24px;border:1px solid #eaeaea}
      .header{background:#111827;color:#fff;padding:16px;text-align:center}
      .content{padding:16px}
      .kv{margin:6px 0}
      .footer{font-size:12px;color:#666;margin-top:20px}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header"><h1>New Signup</h1></div>
      <div class="content">
        <p>A new user has signed up:</p>
        <div class="kv"><strong>Email:</strong> {{ user_email }}</div>
        <div class="kv"><strong>Name:</strong> {{ user_name }}</div>
        <div class="kv"><strong>Details:</strong> {{ details }}</div>
        <p class="footer">Review the account in the admin dashboard: <a href="{{ website_url }}">Admin Console</a></p>
      </div>
    </div>
  </body>
</html>
