<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to Analytics Avenue</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;color:#222;margin:0;padding:0}
      .container{max-width:600px;margin:24px auto;padding:24px;border:1px solid #eaeaea}
      .header{background:#0b5fff;color:#fff;padding:16px;text-align:center}
      .content{padding:16px}
      .cta{display:inline-block;margin-top:16px;padding:10px 16px;background:#0b5fff;color:#fff;text-decoration:none;border-radius:6px}
      .footer{font-size:12px;color:#666;margin-top:20px}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Analytics Avenue</h1>
      </div>
      <div class="content">
        <h2>Hello {{ name }}</h2>
        <p>Welcome to Analytics Avenue. We're excited to have you on board.</p>
        <p>Get started by visiting our platform:</p>
        <p><a class="cta" href="{{ website_url }}">Open Analytics Avenue</a></p>
        <p class="footer">If you didn't sign up, please ignore this email or contact support.</p>
      </div>
    </div>
  </body>
</html>
